[package]
name = "rustway"
version = "0.1.0"
edition = "2021"
description = "RustWay — 以 Rust 为主线的计算机学习教程 Web 程序（编程 / 算法 / 数据库 / 网络 / Linux / 工程实践 / 测试）"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
tower = "0.5"
tower-http = { version = "0.6", features = [
    "fs",
    "compression-gzip",
    "compression-br",
    "trace",
    "set-header",
] }

[profile.release]
lto = true
strip = true
